name: Compilar APK v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK ARMv7
        run: ./gradlew assembleDebug -PabiFilters=armeabi-v7a

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aforo-de-tanque-ARMv7
          path: app/build/outputs/apk/debug/app-debug.apk