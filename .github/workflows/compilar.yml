name: Compilar APK

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir proyecto
          unzip -q AforoTanque_GitHubCloud.zip -d proyecto

      - name: Mostrar contenido del proyecto
        run: |
          echo "=== ARCHIVOS EN EL ZIP ==="
          find proyecto -maxdepth 5 -type f | sort
          echo "=== BUSCANDO GRADLEW ==="
          find proyecto -name gradlew -type f
          echo "=== FIN DEL DIAGNOSTICO ==="
          